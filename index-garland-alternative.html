<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Lucky Charms</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400..700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#253A9F;--pink:#F024A2;--lime:#C4F445;--cream:#FCFAF4;--white:#fff;
  --display:"Arial Narrow","Archivo Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Avenir Next","Avenir",Lato,"Helvetica Neue",Arial,sans-serif;
  --gutter:clamp(18px,4vw,56px);
  --ease-back:cubic-bezier(.3,1.5,.5,1);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{background:var(--cream)}
body{background:var(--cream);color:var(--blue);font-family:var(--body);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
img,svg,canvas{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
[hidden]{display:none !important}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;line-height:.9;font-weight:700;text-wrap:balance}
main{flex:1;outline:none}
main:focus{outline:none}
.skip{position:absolute;left:8px;top:-60px;background:var(--lime);color:var(--blue);padding:10px 14px;z-index:200;font-family:var(--display);font-weight:700;text-transform:uppercase}
.skip:focus{top:20px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:50;background:var(--cream);border-bottom:1px solid rgba(37,58,159,.2)}
.bar::before{content:"";display:block;height:14px;background:var(--lime)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px var(--gutter) 12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(20px,2.4vw,30px);letter-spacing:.01em;line-height:1}
.brand svg{width:clamp(34px,4vw,48px);height:auto;flex:none}
.links{display:flex;gap:clamp(16px,3.4vw,44px)}
.links a{position:relative;text-decoration:none;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(13px,1.5vw,18px);padding:8px 0 10px;line-height:1}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--pink);transform:scaleX(0);transform-origin:0 50%;transition:transform .25s var(--ease-back)}
.links a[aria-current="page"]::after{transform:scaleX(1)}
@media (hover:hover){.links a:hover::after{transform:scaleX(1)}}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px var(--gutter);padding:clamp(40px,6vw,88px) var(--gutter) 0;align-items:start}
.hero h1{font-size:clamp(64px,8.3vw,128px);line-height:.84;margin-bottom:26px}
.lede{font-size:clamp(19px,2vw,24px);max-width:24em}
.hero-art{position:relative;height:340px;margin-top:6px}
.hang{position:absolute;top:0;width:0;height:0;touch-action:pan-y;cursor:grab}
.hang.is-drag{cursor:grabbing}
.hang .swing{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
.hang img{position:absolute;top:0;max-width:none;height:auto;filter:drop-shadow(0 8px 8px rgba(37,58,159,.16));-webkit-user-drag:none;user-select:none}
.tie{position:absolute;left:-28px;top:-14px;width:56px;pointer-events:none;z-index:2}
.tie svg{width:100%;height:auto;overflow:visible}
.garland,.ring{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.swing{transform-origin:50% 0}
.doors{display:grid;grid-template-columns:repeat(3,1fr);margin-top:clamp(48px,6vw,88px)}
.door{position:relative;min-height:clamp(240px,27vw,360px);padding:26px var(--gutter);display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;overflow:hidden}
.door h2{font-size:clamp(46px,6.2vw,96px)}
.door p{margin-top:12px;font-size:clamp(18px,1.7vw,22px);max-width:14em}
.door .arrow{position:relative;z-index:1;font-family:var(--display);font-weight:700;font-size:30px}
.door.blue{background:var(--blue);color:var(--white)}
.door.pink{background:var(--pink);color:var(--white)}
.door.lime{background:var(--lime);color:var(--blue)}
.deco{position:absolute;right:-18px;bottom:-22px;width:clamp(110px,14vw,190px);transition:transform .5s var(--ease-back)}
@media (hover:hover){.door:hover .deco,.s-card:hover .deco{transform:rotate(25deg) scale(1.08)}}

/* ---------- plain pages ---------- */
.page-head{padding:clamp(40px,5vw,72px) var(--gutter) 28px}
.page-head h1{font-size:clamp(48px,7vw,104px);line-height:.88}
.blank{min-height:46vh}

/* ---------- stories ---------- */
.s-index{display:grid;grid-template-columns:repeat(6,1fr)}
.s-card{grid-column:span 2;min-height:clamp(230px,26vw,340px);padding:24px var(--gutter) 24px 24px;text-decoration:none;position:relative;overflow:hidden}
.s-card.major{grid-column:span 3;min-height:clamp(280px,32vw,420px)}
.s-card h2{font-size:clamp(34px,4.6vw,70px);position:relative;z-index:1}
.s-card .deco{width:clamp(100px,12vw,170px)}
.s-card.blue{background:var(--blue);color:var(--white)}
.s-card.pink{background:var(--pink);color:var(--white)}
.s-card.lime{background:var(--lime);color:var(--blue)}
.s-head{padding:clamp(48px,6vw,88px) var(--gutter) clamp(48px,6vw,88px);min-height:50vh}
.s-head h1{font-size:clamp(46px,8vw,120px);line-height:.88;max-width:11em}
.s-head.blue{background:var(--blue);color:var(--white)}
.s-head.pink{background:var(--pink);color:var(--white)}
.s-head.lime{background:var(--lime);color:var(--blue)}

/* ---------- play ---------- */
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);grid-template-areas:"stage title" "stage panel";grid-template-rows:auto 1fr;gap:12px clamp(24px,4vw,64px);padding:clamp(28px,4vw,48px) var(--gutter) 72px;align-items:start}
.play-title{grid-area:title;font-size:clamp(44px,5.6vw,84px);line-height:.88}
.play>.stage-wrap{grid-area:stage}
.play>.panel{grid-area:panel}
.stage-wrap{position:sticky;top:96px;display:flex;flex-direction:column;align-items:center}
.play-stage{position:relative;height:min(calc(100vh - 150px),740px);aspect-ratio:282/580;touch-action:pan-y}
.play-stage .swing{position:absolute;inset:0;transform-origin:50% 0}
.play-canvas{position:absolute;left:3.55%;top:23.71%;width:92.9%;height:74.48%;touch-action:none;cursor:crosshair}
.play-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.play-overlay svg{width:100%;height:100%;overflow:visible}
.play-stage.is-finished .play-canvas{display:none}
.cord-line.anim{stroke-dasharray:1;stroke-dashoffset:1;animation:cordin .8s ease-out .15s forwards}
@keyframes cordin{to{stroke-dashoffset:0}}
.panel{display:grid;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.lab{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:14px;width:76px;flex:none}
.btn{display:inline-flex;align-items:center;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(18px,2vw,22px);padding:16px 24px 13px;background:var(--blue);color:var(--white);text-decoration:none;border-radius:3px;transition:transform .25s var(--ease-back)}
.btn.pink{background:var(--pink)}
.btn.lime{background:var(--lime);color:var(--blue)}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 2.5px var(--blue)}
.btn.small{font-size:15px;padding:11px 16px 9px}
@media (hover:hover){.btn:hover{transform:translateY(-3px) rotate(-1deg)}}
.seg{display:inline-flex;border-radius:3px;box-shadow:inset 0 0 0 2.5px var(--blue);overflow:hidden}
.seg button{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:16px;padding:11px 18px 8px}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--white)}
.picks{display:flex;gap:10px}
.pick{width:68px;height:68px;border-radius:4px;box-shadow:inset 0 0 0 2.5px var(--blue);display:flex;align-items:center;justify-content:center;padding:8px;background:var(--cream);transition:transform .25s var(--ease-back)}
.pick[aria-pressed="true"]{background:var(--lime);box-shadow:inset 0 0 0 4px var(--blue);transform:translateY(-3px)}
.pick svg{width:100%;height:100%}
.sw{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(37,58,159,.65);transition:transform .25s var(--ease-back)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--cream),0 0 0 6px var(--blue);transform:scale(1.08)}
.check{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--blue)}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;width:min(260px,52vw)}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--blue);border-radius:3px}
input[type=range]::-moz-range-track{height:6px;background:var(--blue);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px var(--blue);margin-top:-10px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--lime);border:3px solid var(--blue)}
/* the bag */
.carry-stage{position:relative;height:min(calc(100vh - 150px),740px);aspect-ratio:644/1000;overflow:hidden;touch-action:pan-y;background:var(--cream)}
.carry-stage .zoom{position:absolute;inset:0}
.carry-stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}
.pend{position:absolute;touch-action:none;cursor:grab}
.pend .swing{height:100%}
.pend svg{width:100%;height:100%}
.carry-bar{display:flex;gap:10px;margin-top:12px}
/* save dialog */
#overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(37,58,159,.55)}
#overlay.open{display:flex}
.saved{position:relative;display:grid;gap:12px;justify-items:center;padding:24px;background:var(--cream);max-width:380px;border-radius:6px}
.saved img{max-height:64vh;width:auto;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/20px 20px}
.x{position:absolute;right:10px;top:10px;z-index:3;width:42px;height:42px;border-radius:50%;background:var(--blue);color:var(--white);font-family:var(--display);font-weight:700;font-size:22px;line-height:1}

footer{background:var(--blue);min-height:72px;margin-top:0}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .hero-art{height:360px;margin-top:26px}
  .doors{grid-template-columns:1fr}
  .s-index{grid-template-columns:1fr}
  .s-card,.s-card.major{grid-column:auto;min-height:200px}
  .play{grid-template-columns:1fr;grid-template-areas:"title" "stage" "panel";grid-template-rows:auto}
  .stage-wrap{position:relative;top:0}
  .play-stage,.carry-stage{height:min(66vh,560px)}
}
@media (max-width:560px){
  body{font-size:17px}
  .bar-in{gap:10px}
  .links{gap:14px}
  .links a{letter-spacing:.06em}
  .brand{gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

</style>
</head>

<main id="view" tabindex="-1"></main>
<footer></footer>
<div id="overlay"></div>

'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const COL={blue:'#253A9F',pink:'#F024A2',lime:'#C4F445',cream:'#FCFAF4'};
const KINDS=['radial','four','five'];
const DEF_COL={radial:COL.pink,four:COL.blue,five:COL.lime};

function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const k in (props||{})){
    const v=props[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;
    else if(k==='style'&&typeof v==='object'){ for(const s in v){ if(s.startsWith('--')) el.style.setProperty(s,v[s]); else el.style[s]=v[s]; } }
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(c)); }
  return el;
}
function flowerSVG(kind,color,cls){
  const s=SHAPES[kind]; const vb=kind==='knot'?'-50 -25.05 100 50.1':'-50 -50 100 100';
  const col=color||DEF_COL[kind]||COL.blue; const st=(col===COL.lime||col===COL.cream)?` stroke="${COL.blue}" stroke-width="1.7" stroke-linejoin="round"`:'';
  return `<svg class="${cls||'flower'}" viewBox="${vb}" aria-hidden="true"><path d="${s.d}" fill="${col}"${st}/></svg>`;
}
const P2D={};
const path2d=k=>P2D[k]||(P2D[k]=new Path2D(k==='pouch'?SHAPES.pouch:SHAPES[k].d));

/* ===== swing engine: a damped pendulum; one loop drives everything that hangs, and it sleeps when nothing moves ===== */
const swingers=new Set(); let raf=0,lastT=0;
function swing(el,o={}){
  const s={el,a:o.a||0,v:0,w:o.w||2.4,z:o.z??0.16,max:o.max||44,idle:reduce?0:(o.idle||0),ph:rand(0,6.28),drag:false};
  s.kick=dv=>{ s.v+=reduce?dv*.35:dv; wake(); };
  swingers.add(s); wake(); return s;
}
function wake(){ if(!raf){ lastT=performance.now(); raf=requestAnimationFrame(tick); } }
function tick(t){
  raf=0; const dt=Math.min(.033,(t-lastT)/1000); lastT=t; let live=false;
  for(const s of swingers){
    if(!s.el.isConnected){ swingers.delete(s); continue; }
    if(s.drag){ live=true; continue; }
    let acc=-s.w*s.w*s.a-2*s.z*s.w*s.v;
    if(s.idle) acc+=s.idle*s.w*s.w*Math.sin((t/1000)*.9+s.ph);
    s.v+=acc*dt; s.a+=s.v*dt; s.a=clamp(s.a,-s.max,s.max);
    if(!s.idle&&Math.abs(s.a)<.03&&Math.abs(s.v)<.06){ s.a=0; s.v=0; s.el.style.transform=''; continue; }
    s.el.style.transform=`rotate(${s.a.toFixed(2)}deg)`; live=true;
  }
  if(live) raf=requestAnimationFrame(tick);
}
function hoverKick(slot,s,k=-1.25){
  slot.addEventListener('pointermove',e=>{ if(e.pointerType==='touch'||e.buttons) return; s.kick(clamp(e.movementX||0,-40,40)*k); });
}
/* grab, drag, let go: the object keeps swinging with the speed you gave it */
function dragSwing(slot,s){
  let d=null;
  const pv=()=>{ const r=slot.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top}; };
  slot.addEventListener('pointerdown',e=>{
    if(e.button>0) return;
    d={x:e.clientX,y:e.clientY,moved:false,lt:performance.now(),lv:0};
    try{ slot.setPointerCapture(e.pointerId); }catch(_){}
  });
  slot.addEventListener('pointermove',e=>{
    if(!d) return;
    if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>6){ d.moved=true; s.drag=true; slot.classList.add('is-drag'); }
    if(!d.moved) return;
    const p=pv(); const ang=-Math.atan2(e.clientX-p.x,Math.max(40,e.clientY-p.y))*180/Math.PI;
    const now=performance.now(), dt=Math.max(8,now-d.lt)/1000;
    d.lv=((ang-s.a)/dt)*.55+d.lv*.45; d.lt=now; s.a=clamp(ang,-s.max,s.max); s.v=d.lv;
    s.el.style.transform=`rotate(${s.a.toFixed(2)}deg)`;
  });
  const end=()=>{ if(!d) return; const was=d; d=null; slot.classList.remove('is-drag'); if(was.moved){ s.drag=false; s.v=clamp(s.v,-320,320); wake(); } };
  slot.addEventListener('pointerup',end);
  slot.addEventListener('pointercancel',()=>{ if(d){ d=null; s.drag=false; slot.classList.remove('is-drag'); wake(); } });
}

function openOverlay(node){ const ov=$('#overlay'); ov.replaceChildren(node); ov.classList.add('open'); lastFocus=document.activeElement; const x=$('.x',ov); if(x) x.focus(); }
function closeOverlay(){ const ov=$('#overlay'); ov.classList.remove('open'); ov.replaceChildren(); if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeOverlay(); });

const NAV=[['explore','Explore'],['play','Play'],['stories','Stories']];
function currentRoute(){ const r=(location.hash||'#home').slice(1); return ROUTES[r]?r:'home'; }

/* ===== the pendant: one SVG used by the editor, the finished charm and the bag ===== */
let pendUid=0;
function stitchColour(ground){ return ground===COL.blue||ground===COL.pink?COL.cream:COL.blue; }
function pendantSVG({snap=null,cord=COL.cream,ground=COL.cream,anim=false}={}){
  const id='pc'+(++pendUid); const cx=167,cy=253.5,d=13,sx=(262-2*d)/262,sy=(432-2*d)/432;
  const strands=['M150 64 C146 -4 158 -70 167 -100','M185 64 C189 -4 176 -70 167 -100'];
  const strokes=(col,wd)=>strands.map(dd=>`<path ${anim?'class="cord-line anim" pathLength="1"':''} d="${dd}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linecap="round"/>`).join('');
  return `<svg viewBox="26 -100 282 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your charm">
    <defs><clipPath id="${id}"><path d="${SHAPES.pouch}"/></clipPath></defs>
    ${snap?`<image href="${snap}" x="36.02" y="37.5" width="262" height="432" clip-path="url(#${id})" preserveAspectRatio="none"/>`:''}
    <path d="${SHAPES.pouch}" fill="none" stroke="${COL.blue}" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="${SHAPES.pouch}" transform="translate(${cx} ${cy}) scale(${sx} ${sy}) translate(${-cx} ${-cy})" fill="none" stroke="${stitchColour(ground)}" stroke-width="2.6" stroke-dasharray="7 5.5" stroke-linecap="round"/>
    ${strokes(COL.blue,9.5)}${strokes(cord,5.5)}
    <path d="${SHAPES.knotAbs}" fill="${cord}" stroke="${COL.blue}" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="167" cy="-96" r="5.5" fill="${COL.lime}" stroke="${COL.blue}" stroke-width="2.4"/>
  </svg>`;
}

/* ===== the bag: tap to move your charm, drag it to swing it, walk to shake it ===== */
function bagStage({onPlace}={}){
  const z=h('div',{class:'zoom'},h('img',{class:'bg',src:A('bag'),alt:'A patterned white bag with a pink omamori and an acrylic keychain hanging from it'}));
  const st=h('div',{class:'carry-stage'},z); const hung=[];
  function hang(html,x,y,hPct){
    const pend=h('div',{class:'pend',style:{left:(x*100)+'%',top:(y*100)+'%',height:hPct+'%',aspectRatio:'282/580',transform:'translateX(-50%)'}});
    const sw=h('div',{class:'swing',html}); pend.append(sw); z.append(pend);
    const s=swing(sw,{w:2.5,z:.12,max:50}); dragSwing(pend,s); s.kick(rand(40,70)*(Math.random()<.5?-1:1));
    const rec={pend,s}; hung.push(rec); return rec;
  }
  let down=null;
  st.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,onPend:!!e.target.closest('.pend')}; });
  st.addEventListener('pointerup',e=>{
    if(!down||down.onPend||Math.hypot(e.clientX-down.x,e.clientY-down.y)>8) return;
    const r=z.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    if(onPlace&&x>=0&&x<=1&&y>=0&&y<=1) onPlace(x,y);
  });
  st.hang=hang;
  st.walk=()=>{ let i=0; const t=setInterval(()=>{ hung.forEach(r=>r.s.kick((i%2?-1:1)*rand(45,80))); if(++i>=7) clearInterval(t); },420); };
  return st;
}

/* ===== PNG of a finished charm (downloads are blocked in the published page, so it is shown in a dialog) ===== */
function pendantPNG(svgString,done){
  const W=1128,Hh=2320; const img=new Image();
  img.onload=()=>{ const c=document.createElement('canvas'); c.width=W; c.height=Hh; const x=c.getContext('2d'); x.fillStyle=COL.cream; x.fillRect(0,0,W,Hh); x.drawImage(img,0,0,W,Hh); try{ done(c.toDataURL('image/png')); }catch(e){ done(null); } };
  img.onerror=()=>done(null);
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgString.replace('<svg ','<svg width="1128" height="2320" '));
}

/* ===== home ===== */
const NS='http://www.w3.org/2000/svg';
const svgEl=(t,at)=>{ const e=document.createElementNS(NS,t); for(const k in at) e.setAttribute(k,at[k]); return e; };
const TIE=[COL.pink,COL.blue,COL.lime,COL.pink,COL.blue];
/* each omamori hangs by its own cord; a bow knot ties it onto the line */
function hangOmamori(parent,o,i){
  const slot=h('div',{class:'hang'});
  const sw=h('div',{class:'swing'}); const img=h('img',{src:A(o.k),alt:'',draggable:'false'});
  sw.append(img); slot.append(sw,h('i',{class:'tie',html:flowerSVG('knot',TIE[i],'')}));
  parent.append(slot);
  const s=swing(sw,{w:2.2,z:.1,max:45,idle:.5}); hoverKick(slot,s,-1.1); dragSwing(slot,s);
  o.img=img; o.slot=slot;
}
/* the line sags between a nail on the left and the page edge on the right; the five are spread along it */
function layoutHero(art){
  const W=art.clientWidth, ext=Math.max(0,innerWidth-art.getBoundingClientRect().right), WF=W+ext, small=W<500;
  art.querySelectorAll('.garland').forEach(e=>e.remove());
  const sc=small?clamp(W/600,.45,.9):clamp(W/760,.5,1.15);
  const ws=OMA.map(o=>Math.round(o.h*sc*OMA_META[o.k].aspect));
  const gap=Math.min(26,Math.max(-26,(W-ws.reduce((p,c)=>p+c,0))/(OMA.length-1)));
  let x=0; const xs=OMA.map((o,i)=>{ const px=x+OMA_META[o.k].px*ws[i]; x+=ws[i]+gap; return px; });
  const y0=18, sag=clamp(W*.085,18,60);
  const yAt=px=>{ const u=(px-WF/2)/(WF/2); return y0+sag*(1-u*u); };
  let d=''; for(let k=0;k<=60;k++){ const px=WF*k/60; d+=(k?'L':'M')+px.toFixed(1)+' '+yAt(px).toFixed(1); }
  const g=svgEl('svg',{class:'garland',width:WF,height:y0+sag+14});
  g.append(svgEl('path',{d,fill:'none',stroke:COL.blue,'stroke-width':3.5,'stroke-linecap':'round'}),svgEl('circle',{cx:0,cy:y0,r:8,fill:COL.lime,stroke:COL.blue,'stroke-width':3}));
  art.prepend(g);
  let bottom=0;
  const tw=small?38:56;
  OMA.forEach((o,i)=>{ const m=OMA_META[o.k], py=yAt(xs[i]); const t=o.slot.querySelector('.tie'); t.style.width=tw+'px'; t.style.left=(-tw/2)+'px'; t.style.top=(-tw/4)+'px'; o.slot.style.left=xs[i]+'px'; o.slot.style.top=py+'px'; o.img.style.width=ws[i]+'px'; o.img.style.left=(-m.px*ws[i])+'px'; bottom=Math.max(bottom,py+o.h*sc); });
  art.style.height=(bottom+30)+'px';
}
ROUTES.home=view=>{
  const art=h('div',{class:'hero-art','aria-label':'Omamori hanging from a rail. Drag them to swing.'});
  view.append(h('section',{class:'hero'},

  const door=(col,to,title,text,kind,fcol)=>h('a',{class:'door '+col,href:'#'+to},h('div',{},h('h2',{},title),h('p',{},text)),h('span',{class:'arrow','aria-hidden':'true'},'→'),h('div',{class:'deco',html:flowerSVG(kind,fcol)}));

};

/* ===== PLAY: stamp, brush and repeat flowers on a pouch, tie on a cord, finish it, swing it, carry it ===== */
ROUTES.play=view=>{
  const S=3,PX=36.02,PY=37.5,PW=262,PH=432;
  const PS={tool:'stamp',kind:'radial',color:COL.pink,size:64,tilt:true,ground:COL.cream,cord:COL.cream,gap:14,pattern:false,pOff:0,ops:[],gid:0,finished:false,snap:null};
  const COLS=[COL.pink,COL.blue,COL.lime,COL.cream];
  const cv=h('canvas',{class:'play-canvas',width:PW*S,height:PH*S,role:'img','aria-label':'Drawing area. Tap or drag to place flowers on the pouch.'});
  const ctx=cv.getContext('2d'); const sc=document.createElement('canvas').getContext('2d');
  const inPouch=(x,y)=>sc.isPointInPath(path2d('pouch'),x,y);
  const colFor=()=>PS.color==='mix'?pick(COLS.filter(c=>c!==PS.ground)):PS.color;

  function drawOp(c,op){
    c.save(); c.translate(op.x,op.y); c.rotate(op.rot); const k=op.s/100; c.scale(k,k);
    const p=path2d(op.kind); c.fillStyle=op.col; c.fill(p);
    const edge=(op.col===COL.lime||op.col===COL.cream)?COL.blue:(op.col===PS.ground?COL.cream:null);
    if(edge){ c.lineWidth=1.8/k; c.strokeStyle=edge; c.lineJoin='round'; c.stroke(p); }
    c.restore();
  }
  function base(){ ctx.setTransform(S,0,0,S,-PX*S,-PY*S); ctx.save(); ctx.clip(path2d('pouch')); }
  function redraw(){
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); base();
    ctx.fillStyle=PS.ground; ctx.fillRect(PX-2,PY-2,PW+4,PH+4);
    if(PS.pattern){
      const sz=clamp(PS.size,28,96),p=sz+PS.gap,n=Math.ceil(PW/p)+3; const cx=PX+PW/2,cy=PY+PH/2;
      for(let r=0;r<n+2;r++) for(let c=0;c<n;c++){
        const k=KINDS[(c+r+PS.pOff)%3]; let col=DEF_COL[k]; if(col===PS.ground) col=COL.cream;
        drawOp(ctx,{kind:k,col,s:sz,rot:0,x:cx+(c-(n-1)/2)*p,y:cy+(r-(n+1)/2)*p});
      }
    }
    PS.ops.forEach(o=>drawOp(ctx,o)); ctx.restore();
  }
  function addOp(x,y,g,jit){
    const op={kind:PS.kind,col:colFor(),s:PS.size*(jit?rand(.82,1.12):1),rot:PS.tilt?rand(0,6.283):0,x,y,g}; PS.ops.push(op);
    base(); drawOp(ctx,op); ctx.restore(); return op;
  }
  const toUnits=e=>{ const r=cv.getBoundingClientRect(); return {x:PX+(e.clientX-r.left)/r.width*PW,y:PY+(e.clientY-r.top)/r.height*PH}; };

  /* ---- the stage ---- */
  const overlay=h('div',{class:'play-overlay'});
  const ghost=h('div',{class:'play-overlay','aria-hidden':'true'}); ghost.innerHTML='<svg viewBox="26 -100 282 580"><path id="gp" fill="#F024A2" opacity=".42"/></svg>';
  const sw=h('div',{class:'swing'},cv,overlay,ghost);
  const stage=h('div',{class:'play-stage'},sw);
  const sidx=swing(sw,{w:2.2,z:.1,max:30});
  const bagHost=h('div',{style:{display:'none'}});
  const wrap=h('div',{class:'stage-wrap'},stage,bagHost);
  function renderOverlay(anim){ overlay.innerHTML=pendantSVG({snap:PS.finished?PS.snap:null,cord:PS.cord,ground:PS.ground,anim:!!anim}); }
  function setGhost(x,y){
    const g=$('#gp',ghost); if(!g) return;
    if(PS.finished||PS.tool==='repeat'||x==null){ g.setAttribute('d',''); return; }
    const col=PS.color==='mix'?COL.pink:PS.color; g.setAttribute('d',SHAPES[PS.kind].d); g.setAttribute('fill',col);
    g.setAttribute('transform',`translate(${x} ${y}) scale(${PS.size/100})`);
  }
  let lastP=null,gid=0,drawing=false;
  cv.addEventListener('pointerdown',e=>{
    if(PS.finished) return;
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    const p=toUnits(e);
    if(PS.tool==='repeat'){ PS.pOff=(PS.pOff+1)%3; PS.pattern=true; redraw(); return; }
    drawing=true; gid=++PS.gid; lastP=p; addOp(p.x,p.y,gid,PS.tool==='brush');
  });
  cv.addEventListener('pointermove',e=>{
    const p=toUnits(e);
    if(drawing&&PS.tool==='brush'){ if(Math.hypot(p.x-lastP.x,p.y-lastP.y)>PS.size*.5){ addOp(p.x,p.y,gid,true); lastP=p; } }
    if(e.pointerType==='mouse'&&!drawing) setGhost(p.x,p.y);
  });
  const stop=()=>{ drawing=false; }; cv.addEventListener('pointerup',stop); cv.addEventListener('pointercancel',stop);
  cv.addEventListener('pointerleave',()=>setGhost(null));

  /* ---- controls ---- */
  const seg=(items,get,set)=>{ const box=h('div',{class:'seg',role:'group'}); items.forEach(([v,l])=>{ const b=h('button',{'aria-pressed':String(get()===v),onclick:()=>{ set(v); $$('button',box).forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); }},l); box.append(b); }); return box; };
  const row=(lab,...k)=>h('div',{class:'row'},h('span',{class:'lab'},lab),...k);
  const gapRow=h('div',{class:'row'},h('span',{class:'lab'},'Gap'),h('input',{type:'range',min:'0',max:'60',value:String(PS.gap),'aria-label':'Gap between repeated flowers',oninput:e=>{ PS.gap=+e.target.value; PS.pattern=true; redraw(); }}));
  gapRow.hidden=true;
  const toolSeg=seg([['stamp','Stamp'],['brush','Brush'],['repeat','Repeat']],()=>PS.tool,v=>{ PS.tool=v; gapRow.hidden=v!=='repeat'; if(v==='repeat'){ PS.pattern=true; redraw(); } setGhost(null); });
  const picks=h('div',{class:'picks'},['radial','four','five'].map(k=>h('button',{class:'pick','aria-pressed':String(k===PS.kind),'aria-label':'Shape: '+k,onclick:e=>{ PS.kind=k; $$('.pick',picks).forEach(x=>x.setAttribute('aria-pressed',String(x===e.currentTarget))); }},h('span',{html:flowerSVG(k,COL.blue)}))));
  const swatches=(arr,get,set,label,mix)=>{ const box=h('div',{class:'picks',style:{gap:'8px',flexWrap:'wrap'}}); const all=mix?[...arr,'mix']:arr;
    all.forEach(c=>{ const b=h('button',{class:'sw','aria-pressed':String(get()===c),'aria-label':label+': '+(c==='mix'?'mixed':({[COL.pink]:'pink',[COL.blue]:'blue',[COL.lime]:'lime',[COL.cream]:'cream'})[c]),style:{background:c==='mix'?`conic-gradient(${COL.pink} 0 25%,${COL.blue} 0 50%,${COL.lime} 0 75%,${COL.cream} 0)`:c},onclick:()=>{ set(c); $$('.sw',box).forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); }}); b._c=c; box.append(b); }); return box; };
  const sizeIn=h('input',{type:'range',min:'24',max:'120',value:String(PS.size),'aria-label':'Size',oninput:e=>{ PS.size=+e.target.value; if(PS.pattern){ redraw(); } }});
  const tilt=h('label',{class:'check'},h('input',{type:'checkbox',checked:true,onchange:e=>{ PS.tilt=e.target.checked; }}),'Random tilt');
  const groundSw=swatches(COLS,()=>PS.ground,c=>{ PS.ground=c; redraw(); renderOverlay(); },'Ground');
  const cordSw=swatches(COLS,()=>PS.cord,c=>{ PS.cord=c; renderOverlay(); },'Cord');
  const undo=h('button',{class:'btn small ghost',onclick:()=>{ if(PS.ops.length){ const g=PS.ops[PS.ops.length-1].g; while(PS.ops.length&&PS.ops[PS.ops.length-1].g===g) PS.ops.pop(); } else PS.pattern=false; redraw(); }},'Undo');
  const clear=h('button',{class:'btn small ghost',onclick:()=>{ PS.ops=[]; PS.pattern=false; redraw(); }},'Clear');
  const shuf=h('button',{class:'btn small lime',onclick:shuffle},'Shuffle');
  function shuffle(){
    PS.ground=pick(COLS); PS.pattern=false; PS.ops=[];
    for(let j=0;j<4;j++) for(let i=0;i<3;i++){
      const x=PX+(i+.5)*PW/3+rand(-16,16),y=PY+(j+.5)*PH/4+rand(-14,14); if(!inPouch(x,y)) continue;
      const kind=pick(['radial','four','five']); let col=pick(COLS); if(col===PS.ground) col=COL.cream===PS.ground?COL.pink:COL.cream;
      PS.ops.push({kind,col,s:rand(44,84),rot:rand(0,6.283),x,y,g:++PS.gid});
    }
    redraw(); renderOverlay(); $$('.sw',groundSw).forEach(b=>b.setAttribute('aria-pressed',String(b._c===PS.ground)));
  }
  const edit=h('div',{class:'panel'},
    row('Tool',toolSeg),row('Shape',picks),row('Colour',swatches(COLS,()=>PS.color,c=>{ PS.color=c; },'Colour',true)),
    row('Size',sizeIn,tilt),gapRow,row('Ground',groundSw),row('Cord',cordSw),
    h('div',{class:'row'},undo,clear,shuf));
  const finishBtn=h('button',{class:'btn pink',onclick:finish},'Finish and hang it →');
  const fin=h('div',{class:'panel',hidden:true},
    h('div',{class:'row'},
      h('button',{class:'btn small pink',onclick:()=>{ sidx.kick(rand(45,70)*(Math.random()<.5?-1:1)); }},'Swing it'),
      h('button',{class:'btn small lime',onclick:carryIt},'Carry it'),
      h('button',{class:'btn small',onclick:saveImg},'Save image'),
      h('button',{class:'btn small ghost',onclick:editAgain},'Edit again')));
  let grab=null,bag=null;
  function finish(){
    PS.finished=true; setGhost(null); PS.snap=cv.toDataURL('image/png'); renderOverlay(true);
    stage.classList.add('is-finished'); edit.hidden=true; finishBtn.hidden=true; fin.hidden=false;
    grab=h('div',{style:{position:'absolute',inset:'0',zIndex:'4',touchAction:'pan-y',cursor:'grab'}}); stage.append(grab);
    dragSwing(grab,sidx); hoverKick(grab,sidx,-1.2); setTimeout(()=>sidx.kick(rand(40,60)*(Math.random()<.5?-1:1)),500);
  }
  function editAgain(){
    PS.finished=false; stage.classList.remove('is-finished'); sidx.a=0; sidx.v=0; sw.style.transform=''; if(grab){ grab.remove(); grab=null; } showStage();
    renderOverlay(); edit.hidden=false; finishBtn.hidden=false; fin.hidden=true;
  }
  function showStage(){ stage.style.display=''; bagHost.style.display='none'; bagHost.replaceChildren(); bag=null; }
  function carryIt(){
    if(bag){ showStage(); return; }
    stage.style.display='none'; bagHost.style.display='block'; bagHost.replaceChildren();
    let rec=null; const html=pendantSVG({snap:PS.snap,cord:PS.cord,ground:PS.ground});
    bag=bagStage({onPlace:(x,y)=>{ if(rec){ rec.pend.style.left=(x*100)+'%'; rec.pend.style.top=(y*100)+'%'; rec.s.kick(rand(50,90)); } }});
    rec=bag.hang(html,.28,.07,34); bagHost.append(bag);
    bagHost.append(h('div',{class:'carry-bar'},h('button',{class:'btn small pink',onclick:()=>bag.walk()},'Walk'),h('button',{class:'btn small ghost',onclick:showStage},'Back to the charm')));
  }
  function saveImg(){
    pendantPNG(pendantSVG({snap:PS.snap,cord:PS.cord,ground:PS.ground}),url=>{
      const box=h('div',{class:'saved',role:'dialog','aria-modal':'true','aria-label':'Your charm as an image'},h('button',{class:'x','aria-label':'Close',onclick:closeOverlay},'×'),
        url?h('img',{src:url,alt:'Your finished charm'}):h('p',{},'The image could not be made in this browser.'),
        );
      openOverlay(box);
    });
  }

  /* ---- initial composition so the pouch is never empty ---- */
  const g0=++PS.gid;
  [['radial',COL.pink,72,.4,112,168],['four',COL.blue,66,.2,222,246],['five',COL.lime,62,.1,118,336],['radial',COL.blue,46,.7,226,388],['four',COL.pink,40,.5,170,430]].forEach(([kind,col,s,rot,x,y])=>PS.ops.push({kind,col,s,rot,x,y,g:g0}));
  redraw(); renderOverlay();

  view.append(h('div',{class:'play'},h('h1',{class:'play-title'},'Make a charm'),wrap,h('div',{class:'panel'},edit,finishBtn,fin)));
};

buildNav();
$('.skip').addEventListener('click',e=>{ e.preventDefault(); $('#view').focus(); });
render();

</script>
